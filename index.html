<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Itai Raveh — recreation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --illustration:#3b6df0;
    --brand:#ef5da8;
    --science:#1fae70;
    --animation:#f2822f;
    --ink:#171717;
    --sub:#8c8c8c;
    --bg:#ffffff;
    --line:#ececec;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Plus Jakarta Sans","Helvetica Neue",Arial;
    font-weight:400;
    color:var(--ink);
    background:var(--bg);
    overflow-x:hidden;
  }
  a{color:inherit;}

  /* ---------- NAV ---------- */
  .nav{
    position:fixed; top:0; left:0; right:0;
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 28px;
    z-index:50;
  }
  .nav-left{display:flex; align-items:center; gap:22px; min-width:0;}
  .logo{font-weight:700; font-size:16px; letter-spacing:.01em; cursor:pointer; white-space:nowrap;}
  .nav-links{display:flex; gap:18px; list-style:none; margin:0; padding:0;}
  .nav-links li{font-size:12px; font-weight:700; color:var(--ink); cursor:pointer; transition:color .2s;}
  .nav-links li.dim{color:#bdbdbd;}
  .nav-right{display:flex; gap:18px; font-size:12px; font-weight:700;}
  .nav-right a{text-decoration:none;}
  /* 27px wide, three 1px lines 10px apart — per the tablet/mobile frames */
  .nav-burger{
    display:none; flex-direction:column; justify-content:space-between;
    width:27px; height:21px; flex:none;
    background:none; border:none; cursor:pointer; padding:0; z-index:210;
  }
  .nav-burger span{display:block; width:100%; height:1px; background:#000; transition:transform .25s ease, opacity .2s ease;}

  /* tablet + mobile (the "new homepage 3" frames): bigger logo, burger
     instead of inline links; the links and Instagram/Bio open as one
     full-screen menu. Nav insets are the frames' own: logo at x=44 /
     burger ending at x=715 on the 768 tablet frame, 30 / 346 on the 375
     mobile frame, both with the burger's top line at y=47. */
  @media (max-width:1024px){
    .nav{padding:47px 53px 0 44px; align-items:flex-start;}
    .logo{font-size:28px; letter-spacing:0; line-height:1; margin-top:1px;}
    .nav-burger{display:flex;}
    .nav-links, .nav-right{
      display:none;
      position:fixed; inset:0; z-index:200;
      background:#fff;
      flex-direction:column; align-items:center; justify-content:center;
      gap:26px; list-style:none; margin:0; padding:0;
    }
    .nav-links li{font-size:22px;}
    .nav-right{flex-direction:row; gap:24px; inset:auto 0 48px 0;}
    .nav.menu-open .nav-links, .nav.menu-open .nav-right{display:flex;}
    .nav.menu-open .nav-burger span:nth-child(1){transform:translateY(10px) rotate(45deg);}
    .nav.menu-open .nav-burger span:nth-child(2){opacity:0;}
    .nav.menu-open .nav-burger span:nth-child(3){transform:translateY(-10px) rotate(-45deg);}
  }
  @media (max-width:600px){
    .nav{padding:47px 29px 0 30px;}
  }

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    height:100vh;
    overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    padding:0 8vw;
  }
  /* two scatter layers, behind and in front of the headline — each
     HERO_LAYOUTS slot says which one its image goes in */
  .scatter{position:absolute; inset:0; pointer-events:none;}
  .scatter.back{z-index:1;}
  .scatter.front{z-index:3;}
  .swatch{
    position:absolute; opacity:0; transform:scale(.9) translateY(8px);
    transition:opacity .22s cubic-bezier(.16,1,.3,1), transform .22s cubic-bezier(.16,1,.3,1);
    background:no-repeat center / contain;
  }
  .swatch.active{opacity:1; transform:none;}

  /* Headline. Sizes, line breaks and icon placement are the Figma frames'
     ("new homepage 4/desktop.svg" at 1920, "new homepage 3" tablet at 768
     and mobile at 375), expressed in vw/em so each breakpoint keeps its
     frame's proportions at any width — on a big iMac the block just scales
     up, it never re-wraps. Breaks come from <br class="d|s"> in the markup,
     nowrap stops anything else from breaking. */
  .lead{
    position:relative; z-index:2;
    font-weight:400; font-size:3.5695vw; line-height:1.2857;
    white-space:nowrap; margin:0;
  }
  .lead br.s{display:none;}
  .baseline-probe{display:inline-block; width:0; height:0;}
  .lead .cat{
    text-decoration:underline dotted #000 1px;
    text-underline-offset:.15em;
    pointer-events:auto;
    cursor:pointer; transition:color .25s ease;
  }
  .lead .cat.on-illustration{color:var(--illustration); text-decoration-color:var(--illustration);}
  .lead .cat.on-brand{color:var(--brand); text-decoration-color:var(--brand);}
  .lead .cat.on-science{color:var(--science); text-decoration-color:var(--science);}
  .lead .cat.on-animation{color:var(--animation); text-decoration-color:var(--animation);}
  /* icon size, drop below the baseline, and the gap to the text/comma on
     either side (negative where the PNG's own transparent padding already
     makes the gap) — all measured off desktop.svg, in em */
  .lead .cat-icon{display:inline-block; object-fit:contain;}
  .lead .cat[data-cat="illustration"] .cat-icon{width:1.557em; height:1.571em; vertical-align:-.392em; margin:0 .086em 0 -.113em;}
  .lead .cat[data-cat="brand"] .cat-icon{width:1.486em; height:1.486em; vertical-align:-.492em; margin:0 -.09em 0 -.036em;}
  .lead .cat[data-cat="science"] .cat-icon{width:1.257em; height:1.257em; vertical-align:-.221em; margin:0 -.088em 0 -.32em;}
  .lead .cat[data-cat="animation"] .cat-icon{width:1.486em; height:1.486em; vertical-align:-.42em; margin:0 -.27em 0 .145em;}

  @media (max-width:1024px){
    .lead{text-align:center; font-size:5.844vw;} /* 52.8px on the 768 frame, at 85% */
    .lead br.s{display:inline;}
    .lead br.d{display:none;}
    .lead .cat .cat-icon{width:1.364em; height:1.364em; vertical-align:-.32em; margin:0;}
    .lead .cat[data-cat="illustration"] .cat-icon{width:1.686em; height:1.709em;}
    .lead .cat[data-cat="science"] .cat-icon{width:1.345em; height:1.345em;}
  }
  @media (max-width:600px){
    .lead{font-size:7.707vw;} /* 28.9px on the 375 frame */
    .lead .cat .cat-icon{width:1.425em; height:1.425em;}
    .lead .cat[data-cat="illustration"] .cat-icon{width:1.5em; height:1.537em;}
    .lead .cat[data-cat="science"] .cat-icon{width:1.237em; height:1.237em;}
    .lead .cat[data-cat="animation"] .cat-icon{width:1.5em; height:1.5em;}
  }

  /* looping icon motion: bird turns around, head nods, water tower
     breathes in and out with a pause at each end, plane does a quick
     wobble every few seconds */
  .lead .cat[data-cat="illustration"] .cat-icon{animation:icon-flip 4s infinite;}
  .lead .cat[data-cat="brand"] .cat-icon{transform-origin:50% 85%; animation:icon-nod 3.2s ease-in-out infinite;}
  .lead .cat[data-cat="science"] .cat-icon{transform-origin:50% 100%; animation:icon-breathe 4.4s ease-in-out infinite;}
  .lead .cat[data-cat="animation"] .cat-icon{animation:icon-tilt 3.6s ease-in-out infinite;}
  @keyframes icon-flip{
    0%, 42%{transform:scaleX(1);} 50%, 92%{transform:scaleX(-1);} 100%{transform:scaleX(1);}
  }
  @keyframes icon-nod{
    0%, 50%, 100%{transform:rotate(0);} 60%{transform:rotate(-12deg);} 70%{transform:rotate(3deg);}
    80%{transform:rotate(-12deg);} 90%{transform:rotate(0);}
  }
  @keyframes icon-breathe{
    0%, 15%{transform:scale(1);} 45%, 60%{transform:scale(.84);} 90%, 100%{transform:scale(1);}
  }
  @keyframes icon-tilt{
    0%, 76%, 100%{transform:rotate(0);} 81%{transform:rotate(-14deg);} 87%{transform:rotate(12deg);}
    93%{transform:rotate(-5deg);}
  }
  @media (prefers-reduced-motion:reduce){
    .lead .cat .cat-icon{animation:none;}
  }

  /* ---------- GRID PAGE ---------- */
  /* side padding matches .nav's own 28px exactly, so the grid's edges
     line up with "Itai Raveh" and "Bio" instead of sitting inset from
     them */
  .grid-page{display:none; padding:100px 28px 80px;}
  .grid-page.show{display:block;}
  .breadcrumb{
    font-size:12px; color:var(--sub);
    padding-bottom:14px; margin-bottom:34px;
    border-bottom:1px solid var(--line);
  }
  /* true masonry, computed in JS (layoutMasonry). The track math is
     measured off the Figma export (1440w light-fix.svg), not guessed:
     every rect in that file resolves to a 9-track grid at that width,
     track ≈126px, gap 14px — a normal card spans 2 tracks (≈265px), a
     featured one spans 3 (≈405px) or 4 (≈544px). Each rectangle is then
     sized to its own image's real aspect ratio (via IMG_RATIO) and
     packed into whichever column is shortest, so images fill their box
     edge-to-edge instead of being forced into a uniform grid cell. CSS
     Grid can't produce this — its rows share one height across every
     track in the row, which is what caused the uneven layout before. */
  .grid{position:relative;}
  .card{position:absolute; top:0; left:0;}

  .card-thumb-link{display:block; text-decoration:none;}
  .card-thumb{
    position:relative;
    border-radius:0; overflow:hidden; background:#f1f1f1;
    transition:transform .9s cubic-bezier(.16,1,.3,1);
  }
  .card-thumb-link:hover .card-thumb{transform:scale(1.01);}
  .card-thumb .fill-img{
    display:block; position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  }
  .card-thumb .fill-block{
    position:absolute; inset:0;
  }
  .card-thumb .fill-img, .card-thumb .fill-block{
    filter:blur(18px); transform:scale(1.15); opacity:.9;
    transition:filter .9s cubic-bezier(.16,1,.3,1), transform .9s cubic-bezier(.16,1,.3,1), opacity .25s ease;
  }
  .card-thumb.loaded .fill-img, .card-thumb.loaded .fill-block{filter:blur(0); transform:scale(1); opacity:1;}
  /* "show all three illustrations one after another" (springs of Ein
     Qiniyye) — a plain vertical stack of full images instead of the
     usual single-frame hover-cycle thumb */
  .card-thumb-stack{display:flex; flex-direction:column; gap:14px;}
  .card-thumb-stack a{display:block; text-decoration:none; overflow:hidden;}
  .card-thumb-stack img{
    display:block; width:100%; border-radius:0;
    transition:transform .9s cubic-bezier(.16,1,.3,1);
  }
  /* each of the stacked images (springs of Ein Qiniyye) has its own link
     and reacts to hover on its own — not the whole stack, and not the
     .card-thumb-link:hover rule above, which only applies to the
     single-image thumb layout this card doesn't use */
  .card-thumb-stack a:hover img{transform:scale(1.01);}
  /* mobile: one plain column, every card the same size regardless of its
     image's own aspect ratio — overrides the per-item inline aspect-ratio
     set in cardHTML/layoutMasonry */
  @media (max-width:520px){
    .card-thumb, .card-thumb-stack img{aspect-ratio:3/4 !important;}
  }
  .card-thumb .glyph{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-size:34px; opacity:0;
    transition:opacity .5s ease .1s;
  }
  .card-thumb.loaded .glyph{opacity:1;}

  /* multi-image projects: on hover the thumbnail auto-cycles through the
     gallery, and these arrows appear for manual control too */
  .thumb-nav{
    position:absolute; top:50%; transform:translateY(-50%);
    width:26px; height:26px; border-radius:50%; border:none;
    background:rgba(255,255,255,.85); color:var(--ink);
    font-size:15px; line-height:1; cursor:pointer;
    opacity:0; transition:opacity .2s ease, background .2s ease;
    display:flex; align-items:center; justify-content:center;
    z-index:2; padding:0;
  }
  .card-thumb-link:hover .thumb-nav{opacity:1;}
  .thumb-nav:hover{background:#fff;}
  .thumb-nav.prev{left:8px;}
  .thumb-nav.next{right:8px;}

  /* title sits below the image, description below the title. "Read more"
     lives only in the lightbox now (.lb-project-link) — the grid caption
     used to duplicate it, so there's no .readmore rule here any more. */
  .card-caption{margin-top:6px;}
  .card-title{font-size:12px; font-weight:700; color:#000;}
  .card-title > a{text-decoration:none;}
  .card-desc{
    font-size:12px; font-weight:400; color:#000; line-height:1.4;
    margin:2px 0 0;
  }

  /* ---------- MODAL (the popup Readymag couldn't do) ---------- */
  /* project preview: no card, no box — image and text float directly on
     the light scrim (see .lightbox), exactly like the symbol lightbox
     below. Measured off the updated Figma export ("1440w lightbox
     new.svg"): the white "frame" is the backdrop itself, not a panel
     around the content. Content eases in with a gentle rise + fade
     rather than appearing instantly. Click-outside, Escape, or the
     viewport-corner "close" all dismiss it. */
  .lb-panel{
    display:flex; align-items:center; gap:32px;
    max-width:95vw; max-height:94vh;
    opacity:0; transform:translateY(10px);
    transition:opacity .4s cubic-bezier(.16,1,.3,1), transform .4s cubic-bezier(.16,1,.3,1);
    pointer-events:none; /* a flex row's own box is a rectangle spanning
      its tallest child even where a shorter child (e.g. short text next
      to a tall image) leaves visually-empty space — without this, that
      empty-looking space still belongs to .lb-panel and swallows clicks
      that should count as "click the background to close". Re-enabled
      on the actual content below, so only real content blocks clicks. */
  }
  .lightbox.show .lb-panel{opacity:1; transform:none;}
  .lb-project-media{
    position:relative; display:grid; flex:0 1 auto; min-width:0;
    max-width:74vw; max-height:94vh;
    pointer-events:auto;
  }
  /* two stacked layers (same grid cell) for a real crossfade between
     gallery images — swapping innerHTML on the hidden one and fading
     opacity on both at once, so one is always fully visible instead of
     a hard cut (or, worse, a moment where neither is, which is what
     caused the grey flash on cards with several images) */
  .lb-media-layer{grid-area:1/1; transition:opacity .35s ease;}
  .lb-project-media img, .lb-project-media .fill-block{
    display:block; max-width:100%; max-height:94vh;
    width:auto; height:auto; object-fit:contain; border-radius:0;
  }
  .lb-project-media.has-multi .lb-media-layer{cursor:pointer;}
  .lb-project-text{
    flex:0 1 auto; max-width:280px;
    display:flex; flex-direction:column;
    pointer-events:auto;
    /* stretched to the image's own full height (.lb-panel otherwise
       vertically centers its two children as a unit) so "close" can sit
       at the image's top edge while .lb-project-body below centers the
       rest of the text within the remaining height — two independent
       alignments inside one column, not one alignment for the whole
       block */
    align-self:stretch;
    /* a padded safe zone around the text, cancelled visually by the
     matching negative margin — so selecting/copying text (a click-drag
     whose mouseup can easily land just outside the tight glyph box,
     e.g. below the last line) doesn't fall through to the backdrop and
     close the lightbox mid-selection */
    padding:16px 8px;
    margin:-16px -8px;
  }
  /* fills the remaining height under "close" (.lb-project-text is a flex
     column stretched to the image's height) and centers title/desc/note/
     link vertically within that space — independent of where "close"
     itself sits */
  .lb-project-body{flex:1; display:flex; flex-direction:column; justify-content:center; min-height:0;}
  .lb-project-title{font-size:14px; font-weight:700; margin:0 0 8px; line-height:1.3; color:#000;}
  .lb-project-desc{font-size:12px; color:#000; line-height:1.5; margin:0 0 10px;}
  .lb-project-note{font-size:12px; font-style:italic; color:#000; line-height:1.6; margin:0 0 14px;}
  .lb-project-link{
    font-size:12px; font-weight:600; color:#000; text-decoration:underline;
    text-decoration-style:dotted; text-underline-offset:3px;
  }
  /* "close" is content-anchored (left-aligned with the text column) rather
     than pinned to the viewport corner. It's the first child of the
     stretched .lb-project-text column (not part of .lb-project-body's
     centered group), so it naturally sits at the image's own top edge
     regardless of how tall the centered text below it is. align-self
     keeps it shrink-wrapped to its own text width — a flex column's
     default align-items:stretch would otherwise stretch this <button>
     to the full column width, and buttons center their text by default,
     pulling "close" away from the left edge the rest of the text aligns to. */
  .lb-project-close{
    display:block; flex:none; align-self:flex-start; background:none; border:none; cursor:pointer;
    font-size:12px; font-weight:600; color:#000; opacity:.7;
    letter-spacing:.02em; text-decoration:underline; text-underline-offset:3px;
    margin:0 0 14px; padding:0; transition:opacity .2s;
  }
  .lb-project-close:hover{opacity:1;}
  .lb-panel-nav{
    position:absolute; top:50%; transform:translateY(-50%);
    width:26px; height:26px; border-radius:50%; border:none;
    background:rgba(255,255,255,.85); color:var(--ink);
    font-size:15px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding:0;
    transition:background .2s ease;
  }
  .lb-panel-nav:hover{background:#fff;}
  .lb-panel-nav.prev{left:20px;}
  .lb-panel-nav.next{right:20px;}

  /* ---------- CASE STUDY: SERIES LAYOUT ---------- */
  .case-top{max-width:1180px; margin:0 auto; padding:110px 28px 20px; position:relative;}
  .case-top .back{
    position:static; display:inline-block; margin-bottom:38px;
    font-size:13px; font-weight:600; color:var(--sub); cursor:pointer;
  }
  .case-top .back:hover{color:var(--ink);}
  .case-h1{
    font-size:clamp(28px,4vw,46px); font-weight:700;
    line-height:1.12; letter-spacing:-.01em;
    max-width:14ch; margin:0 0 30px;
  }
  .case-intro-cols{
    display:grid; grid-template-columns:repeat(2,minmax(0,1fr));
    gap:26px; max-width:760px;
  }
  @media (max-width:720px){ .case-intro-cols{grid-template-columns:1fr;} }
  .case-intro-cols p{font-size:15px; line-height:1.6; margin:0; color:#222;}
  .case-note{font-style:italic; color:var(--sub);}

  .series{padding:90px 28px 20px; max-width:1500px; margin:0 auto;}
  .series-statement{
    font-size:clamp(22px,3.1vw,40px); font-weight:400; line-height:1.3;
    text-align:center; max-width:22ch; margin:0 auto 70px;
    opacity:0; transform:translateY(14px);
    transition:opacity .7s cubic-bezier(.16,1,.3,1), transform .7s cubic-bezier(.16,1,.3,1);
  }
  .series-statement.in{opacity:1; transform:translateY(0);}

  .series-grid{
    display:grid; grid-template-columns:repeat(5,1fr);
    gap:52px 30px;
  }
  @media (max-width:1000px){ .series-grid{grid-template-columns:repeat(3,1fr);} }
  @media (max-width:600px){ .series-grid{grid-template-columns:repeat(2,1fr);} }

  .sym{
    text-decoration:none; display:block; text-align:center;
    opacity:0; transform:translateY(16px);
    transition:opacity .6s cubic-bezier(.16,1,.3,1), transform .6s cubic-bezier(.16,1,.3,1);
  }
  .sym.in{opacity:1; transform:translateY(0);}
  .sym-img{
    aspect-ratio:1/1;
    background-size:contain; background-repeat:no-repeat; background-position:center;
    transition:transform .45s cubic-bezier(.16,1.2,.3,1);
  }
  .sym:hover .sym-img{transform:scale(1.07);}
  .sym-name{
    margin-top:10px; font-size:11px; letter-spacing:.02em;
    color:#444;
  }

  /* ---------- LIGHTBOX (single symbol, deep-linked) ---------- */
  /* white scrim, not a blackout — the "frame" is this light wash itself,
     with no card/panel behind the content (see .lb-panel). The grid
     stays faintly visible underneath, dimmed toward white instead of
     black. */
  .lightbox{
    position:fixed; inset:0; z-index:260;
    background:rgba(255,255,255,.98);
    display:flex; align-items:center; justify-content:center;
    opacity:0; visibility:hidden;
    transition:opacity .3s cubic-bezier(.16,1,.3,1);
  }
  .lightbox.show{opacity:1; visibility:visible;}
  .lb-figure{
    margin:0; text-align:center; max-width:min(560px,80vw);
    transform:scale(.95); transition:transform .45s cubic-bezier(.16,1.25,.3,1);
  }
  .lightbox.show .lb-figure{transform:scale(1);}
  .lb-figure img{width:100%; height:auto; display:block;}
  .lb-figure figcaption{
    margin-top:22px; font-size:13px; color:var(--ink);
    display:flex; gap:10px; justify-content:center; align-items:baseline;
  }
  .lb-figure figcaption span{font-size:11px; letter-spacing:.08em; text-transform:uppercase; font-weight:700;}
  .lb-close, .lb-nav{
    position:absolute; background:none; border:none; cursor:pointer;
    line-height:1;
  }
  .lb-close{
    top:14px; right:18px; font-size:14px; font-weight:600;
    color:var(--ink); letter-spacing:.02em; text-decoration:underline;
    text-underline-offset:3px; opacity:.85; transition:opacity .2s;
    padding:14px 16px; /* bigger hit target than the text alone */
  }
  .lb-close:hover{opacity:1;}
  .lb-nav{top:50%; transform:translateY(-50%); font-size:36px; padding:10px 18px; color:rgba(0,0,0,.4);}
  .lb-nav:hover{color:var(--ink);}
  .lb-nav.prev{left:12px;}
  .lb-nav.next{right:12px;}

  /* ---------- CASE STUDY PAGE ---------- */
  .case-page{display:none;}
  .case-page.show{display:block;}
  .case-hero{
    min-height:56vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    padding:120px 8vw 60px; color:#fff;
  }
  .case-hero .back{
    position:absolute; top:22px; left:28px;
    font-size:13px; font-weight:600; color:#fff;
    cursor:pointer; z-index:60; opacity:.85;
  }
  .case-hero .back:hover{opacity:1;}
  .case-hero-glyph{font-size:64px; margin-bottom:18px;}
  .case-hero h1{font-size:clamp(24px,4vw,40px); font-weight:700; margin:0 0 14px;}
  .case-hero p{font-size:16px; max-width:52ch; line-height:1.6; opacity:.92; margin:0;}

  .case-body{max-width:760px; margin:0 auto; padding:60px 24px;}

<script>
/* ---------------------------------------------------------
   DATA — this whole site is driven from this one object.
   Add a project by adding one entry here, nothing else.

   Each project:
     slug   — used in the URL (#/category/slug), auto-built
              from the title if you don't set one
     img    — cover image; images: [...] adds a gallery (hover-cycles on
              the card, arrows/click in the preview lightbox)
     caseStudy — adds a "Read more" long-form page (#/category/slug)
     c, g   — placeholder color + emoji, used until the project has an img
--------------------------------------------------------- */

function symUrl(cat, projectSlug, file){
  // illustration's images live under illustration-projects/illustration-editorial,
  // not a flat images/illustration/ folder
  const base = cat === 'illustration' ? 'illustration-projects' : cat;
  return `images/${base}/${projectSlug}/${file}.webp`;
}

function slugify(s){
  return s.toLowerCase().replace(/['"]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}

/* uploaded filenames are arbitrary (spaces, parens, Hebrew) — encode each
   path segment so they resolve correctly as a URL regardless */
function encodeImgPath(path){
  return path.split('/').map(encodeURIComponent).join('/');
}

/* builds a {cover, then -2, -3, ...} gallery array for a project folder
   that follows the {slug}-cover.ext / {slug}-N.ext naming convention */
function galleryRange(dir, slug, ext, count){
  const arr = [{img:`${dir}/${slug}-cover.${ext}`}];
  for(let i = 2; i <= count; i++) arr.push({img:`${dir}/${slug}-${i}.${ext}`});
  return arr;
}

/* Any object with c/g (color+glyph) can instead carry img:'url' and it
   will render as a real photo/illustration, cover-fit, no code changes
   needed elsewhere. Leave img unset to keep using placeholder color+emoji. */
function bg(obj){
  return obj.img
    ? `background-image:url('${obj.img}'); background-size:cover; background-position:center;`
    : `background:${obj.c || '#eee'};`;
}
function glyphHTML(obj){
  return obj.img ? '' : (obj.g || '');

  if(!hero.offsetParent) return; // hero is display:none — nothing to measure against
  const vw = window.innerWidth; // breakpoints match the CSS media queries
  const L = vw <= 600 ? HERO_LAYOUTS.mobile : vw <= 1024 ? HERO_LAYOUTS.tablet : HERO_LAYOUTS.desktop;
  const s = vw / L.frameW * L.scale;
  const base = baselineProbe.getBoundingClientRect().top - hero.getBoundingClientRect().top;
  heroSwatches.forEach(({el, k})=>{

    Object.assign(el.style, {
      left: vw / 2 + (x - L.frameW / 2) * s + 'px', top: base + (y - L.baseline) * s + 'px',
      width: w * s + 'px', height: h * s + 'px',

/* Mouse: hover shows a category's scatter, click goes there. Touch has no
   hover (and fires an emulated mouseenter right before click, which would
   otherwise show + navigate in one tap), so there the first tap shows it,
   a second tap on the same word goes there, and tapping anywhere else
   hides it. */
const canHover = window.matchMedia('(hover: hover)');

  const cat = el.dataset.cat;
  el.addEventListener('mouseenter', ()=>{ if(canHover.matches) setActiveCat(cat); });
  el.addEventListener('mouseleave', ()=>{ if(canHover.matches) setActiveCat(null); });
  el.addEventListener('click', e=>{
    if(!canHover.matches && tappedCat !== cat){
      e.stopPropagation();
      tappedCat = cat;
      setActiveCat(cat);
      return;

    tappedCat = null;
    setActiveCat(null);
    location.hash = '#/' + cat;

/* ---------------------------------------------------------
   ROUTER — URL design, and why it is shaped this way.

   One canonical URL per project. That URL is the full page:
     #/illustration/city-symbol
   It is what you share, what search engines index, and what a
   visitor arriving cold should land on.

   The popup is a PREVIEW of that same project, shown over the
   grid you were already looking at. It gets its own restorable
   URL so the back button closes it and a refresh reopens it:
     #/illustration?preview=city-symbol
   A preview of a project with a case study has a "Read more" link
   to the canonical URL above.

   A third level deep-links one symbol inside a project:
     #/illustration/city-symbol/ymca
   Worth doing here because each symbol is individually named and
   meaningful. Not worth doing for a generic image carousel.
--------------------------------------------------------- */
function parseHash(){
  const raw = location.hash.replace(/^#\/?/, '');
  const [pathPart, queryPart] = raw.split('?');
  const [cat, slug, sub] = pathPart.split('/').filter(Boolean);
  const params = new URLSearchParams(queryPart || '');
  return {
    cat: cat || null,
    slug: slug || null,
    sub: sub || null,
    preview: params.get('preview'),
    previewImg: params.get('i')
  };
}

function findItem(cat, slug){
  if(!CATS[cat]) return null;
  const all = CATS[cat].items.concat(CATS[cat].editorial || []);
  return all.find(i=> i.slug === slug) || null;
}

/* every symbol across a case study, flattened, for deep-link lookup */
function findSymbol(item, subSlug){
  const cs = item && item.caseStudy;
  if(!cs || !cs.series) return null;
  for(const s of cs.series){
    const hit = s.symbols.find(sym => slugify(sym.n) === subSlug);
    if(hit) return {...hit, series: s};
  }
  return null;
}

function route(){
  const {cat, slug, sub, preview, previewImg} = parseHash();
  stopAllCardGalleries();

  // home
  if(!cat){
    closeLightbox();
    casePage.classList.remove('show');
    gridPage.classList.remove('show');
    hero.style.display = 'flex';
    navLinks.forEach(l=>l.classList.remove('dim'));
    return;
  }
  if(!CATS[cat]) return;

  const item = slug ? findItem(cat, slug) : null;

  // canonical project page
  if(item){
    hero.style.display = 'none';
    gridPage.classList.remove('show');
    if(casePage.dataset.slug !== item.slug){
      renderCasePage(cat, item);
      casePage.dataset.slug = item.slug;
      window.scrollTo(0,0);
    }
    casePage.classList.add('show');
    navLinks.forEach(l=> l.classList.toggle('dim', l.dataset.cat !== cat));

    // deep-linked single symbol
    const sym = sub ? findSymbol(item, sub) : null;
    if(sym) openLightbox(cat, item, sym);
    else closeLightbox();
    return;
  }

  // category grid, optionally with a preview popup over it
  casePage.classList.remove('show');
  casePage.dataset.slug = '';
  closeLightbox();
  hero.style.display = 'none';
  if(currentCat !== cat){
    renderGrid(cat);
    currentCat = cat;
  }
  gridPage.classList.add('show');
  // .grid-page was display:none until the line above, so the masonry
  // measured 0-width if computed inside renderGrid — lay out now instead
  gridPage.querySelectorAll('.grid').forEach(layoutMasonry);
  navLinks.forEach(l=> l.classList.toggle('dim', l.dataset.cat !== cat));

  const previewItem = preview ? findItem(cat, preview) : null;
  if(previewItem) openProjectLightbox(cat, previewItem, previewImg ? +previewImg : 0);
  else closeLightbox();
}

/* ---------------------------------------------------------
   In-page link handling.

   In a normal browser, cards and symbols carry a real href, so
   right-click > "Open in new tab" and middle-click both work.

   Inside a sandboxed preview (this file shown in an iframe), any
   href navigation is caught by the host and turns into an
   "open external link" prompt. So when we detect we are framed,
   we render the target as data-href instead and drive the router
   ourselves. Deployed on your own domain, hrefs come back.
--------------------------------------------------------- */
const FRAMED = (()=>{ try { return window.self !== window.top; } catch(e){ return true; } })();

function linkAttr(target){
  return FRAMED ? `data-href="${target}"` : `href="${target}"`;
}

// set right before navigating to a grid card's preview, consumed once by
// openProjectLightbox to fly the clicked thumbnail into place instead of
// the lightbox just appearing — the classic FLIP technique: record the
// image's on-screen rect here (First), let the lightbox lay out normally
// at its real size (Last), then in openProjectLightbox invert that delta
// into a transform and animate it back to identity.
let pendingFlight = null;

document.addEventListener('click', (e)=>{
  // buttons (thumb-nav arrows, lightbox nav/close) sit inside a card's
  // <a> for layout reasons but have their own click handlers — without
  // this check the capture-phase router below hijacks their clicks into
  // a navigation before the button's own listener ever runs
  if(e.target.closest('button')) return;
  const a = e.target.closest('a[href^="#"], a[data-href], [data-href]');
  if(!a) return;
  if(e.metaKey || e.ctrlKey || e.shiftKey) return; // let new-tab through
  e.preventDefault();
  e.stopPropagation();
  const raw = a.getAttribute('data-href') || a.getAttribute('href') || '';
  const target = raw.startsWith('#') ? raw.slice(1) : raw;
  if(target.includes('?preview=')){
    const srcEl = a.querySelector('img, .fill-img, .fill-block');
    pendingFlight = srcEl ? {rect: srcEl.getBoundingClientRect()} : null;
  } else {
    pendingFlight = null;
  }
  if(location.hash.slice(1) === target) route();
  else location.hash = target;
}, true); // capture phase, ahead of any host handler

window.addEventListener('hashchange', route);
window.addEventListener('load', route);

/* fade the newly-entered top-level section in from white on cross-section
   navigation (home <-> category, category <-> category) — replaces the
   old black overlay, which dipped to opaque black and back instead of
   revealing cleanly, and was still mid-dip while the grid underneath was
   itself still blurred-up/loading, reading as a flash. Any lightbox the
   same navigation opens (e.g. a grid landing on ?preview=) already fades
   in on its own via .lb-panel's transition, at a matching duration, so
   page and project appear together without extra sync code here.
   Same-section navigation (opening a preview/symbol on a page you're
   already on) isn't touched — this only fires on a genuine new entrance. */
let lastTopLevel = null;
window.addEventListener('hashchange', ()=>{
  const {cat} = parseHash();
  if(cat !== lastTopLevel){
    const target = !cat ? hero : (casePage.classList.contains('show') ? casePage : gridPage);
    target.style.transition = 'none';
    target.style.opacity = '0';
    requestAnimationFrame(()=> requestAnimationFrame(()=>{
      target.style.transition = 'opacity .45s cubic-bezier(.16,1,.3,1)';
      target.style.opacity = '1';
    }));
  }
  lastTopLevel = cat;
});

/* ---------------------------------------------------------
   GRID — a real masonry, packed in JS by layoutMasonry() below (see
   .grid/.card rules for why CSS Grid alone can't do this). Each card
   carries the aspect ratio of its own cover image, read once from
   IMG_RATIO. `item.span` is a track count out of the 9-track desktop
   grid (2 = normal, 3/4 = featured); layoutMasonry scales it down
   proportionally at narrower track counts.
--------------------------------------------------------- */
function cardHTML(cat, item, i){
  const cardTarget = '#/' + cat + '?preview=' + item.slug;
  const hasImg = !!item.img;
  const ratio = (hasImg && IMG_RATIO[item.img]) || item.ratio || 1.3;
  // a stacked card (springs of Ein Qiniyye) has no single hover-cycle
  // thumb — each of its images is its own link, opening the lightbox at
  // that specific image, instead of all three funneling into the same
  // (always-first) preview
  const thumbHTML = item.stack && item.images
    ? `<div class="card-thumb card-thumb-stack">${item.images.map((im, imgIdx) =>
        `<a ${linkAttr(cardTarget + '&i=' + imgIdx)}><img src="${encodeImgPath(im.img)}" alt="${item.t}" loading="lazy" style="aspect-ratio:${IMG_RATIO[im.img] || 1.3}"></a>`
      ).join('')}</div>`
    : `<a class="card-thumb-link" ${linkAttr(cardTarget)}>
        <div class="card-thumb" style="aspect-ratio:${ratio}">
          ${hasImg
            ? `<img class="fill-img" src="${encodeImgPath(item.img)}" alt="${item.t}" loading="lazy">`
            : `<div class="fill-block" style="${bg(item)}"></div><div class="glyph">${glyphHTML(item)}</div>`}
        </div>
      </a>`;
  const mobilePriority = item.mobilePriority !== undefined ? item.mobilePriority : i;
  const colAttr = item.col !== undefined ? ` data-col="${item.col}"` : '';
  return `
    <div class="card" data-i="${i}" data-span="${item.span || 2}" data-mp="${mobilePriority}"${colAttr}>
      ${thumbHTML}
      <div class="card-caption">
        <div class="card-title">
          <a ${linkAttr(cardTarget)}>${item.t}</a>
        </div>
        ${item.d ? `<p class="card-desc">${item.d}</p>` : ''}
      </div>
    </div>`;
}

function gridHTML(cat, items, indexOffset){
  return `<div class="grid">${items.map((it,i)=>cardHTML(cat,it,indexOffset+i)).join('')}</div>`;
}

/* Packs a grid's cards into the shortest available track(s), like
   Pinterest/Masonry — each card keeps its own real height, so a card next
   to a much taller neighbor still continues right after its own content
   instead of waiting for the tall one (a row-aligned layout was tried and
   reverted: forcing every card in a "row" to share one top, sized to the
   tallest member, left huge dead space under shorter cards whenever a
   tall outlier like the Springs stacked triptych shared their row).
   A card can carry a designer-assigned data-col (desktop only) to fix
   its horizontal position — layoutMasonry still auto-stacks it vertically
   below whatever's already in that column, it just skips the "shortest
   column" search. Track count and gap are the values measured off the
   Figma export (see the .grid comment above). Recomputed on render and
   on resize (debounced), since it depends on measured pixel widths. */
const GRID_ROW_GAP = 18; // vertical space after a card's caption, before the next card in that track (horizontal colGap stays 14, unrelated to this)
function layoutMasonry(gridEl){
  const cards = Array.from(gridEl.children).filter(el => el.classList.contains('card'));
  if(!cards.length){ gridEl.style.height = ''; return; }
  const w = gridEl.clientWidth;
  const trackCount = w >= 901 ? 9 : w >= 521 ? 2 : 1;
  const colGap = 14;
  const trackW = (w - colGap * (trackCount - 1)) / trackCount;
  const spanOf = card => trackCount === 9 ? Math.min(9, Math.max(1, +card.dataset.span || 2)) : 1;

  cards.forEach(card=>{
    const span = spanOf(card);
    card.style.width = (trackW * span + colGap * (span - 1)) + 'px';
  });

  // mobile is a single column, so stacking order IS reading order — most
  // cards keep their normal (DOM/data) order, but a project can carry a
  // mobilePriority to jump the queue (e.g. City Symbol wants to sit right
  // after the first project on mobile, even though the desktop masonry
  // — which doesn't care about order, only column height — places it
  // elsewhere)
  const orderedCards = trackCount === 1
    ? [...cards].sort((a, b) => parseFloat(a.dataset.mp) - parseFloat(b.dataset.mp))
    : cards;

  const colHeights = new Array(trackCount).fill(0);
  orderedCards.forEach(card=>{
    const span = spanOf(card);
    const explicitCol = trackCount === 9 && card.dataset.col !== undefined ? +card.dataset.col : null;
    let bestCol = 0, bestTop = Infinity;
    if(explicitCol !== null){
      bestCol = explicitCol;
      bestTop = Math.max(...colHeights.slice(explicitCol, explicitCol + span));
    } else {
      for(let c = 0; c <= trackCount - span; c++){
        const top = Math.max(...colHeights.slice(c, c + span));
        if(top < bestTop){ bestTop = top; bestCol = c; }
      }
    }
    card.style.left = (bestCol * (trackW + colGap)) + 'px';
    card.style.top = bestTop + 'px';
    const newHeight = bestTop + card.offsetHeight + GRID_ROW_GAP;
    for(let c = bestCol; c < bestCol + span; c++) colHeights[c] = newHeight;
  });
  gridEl.style.height = (Math.max(...colHeights) - GRID_ROW_GAP) + 'px';
}

let masonryResizeTimer;
window.addEventListener('resize', ()=>{
  clearTimeout(masonryResizeTimer);
  masonryResizeTimer = setTimeout(()=>{
    if(gridPage.classList.contains('show')) gridPage.querySelectorAll('.grid').forEach(layoutMasonry);
  }, 120);
});

function renderGrid(cat){
  const data = CATS[cat];
  let html = `
    <div class="breadcrumb">Projects</div>
    ${gridHTML(cat, data.items, 0)}
  `;
  // optional labeled subsection, e.g. Illustration → Editorial and publications

  gridPage.innerHTML = html;
  // not laid out here: .grid-page is still display:none at this point,
  // so it would measure 0 width — route() lays it out once shown

    setTimeout(()=> thumb.classList.add('loaded'), 150 + i*70 + Math.random()*200);
  });
  wireCardGalleries(cat);
}

/* ---------------------------------------------------------
   CARD HOVER GALLERIES — a project with more than one image
   auto-cycles through them while its card is hovered (a manual
   arrow pair is also shown, for anyone who wants to linger on
   one frame). Leaving stops on whatever frame is showing. This is
   separate from the lightbox's own gallery, which is manual-only.
--------------------------------------------------------- */
// cross-card registry of "stop cycling" fns for any gallery currently
// hovered — route() clears all of them on every navigation, since a
// click that opens a lightbox never fires mouseleave on the thumb it
// clicked (see wireCardGalleries)
const activeCardTimers = new Set();
function stopAllCardGalleries(){
  activeCardTimers.forEach(stop => stop());
  activeCardTimers.clear();
}

function wireCardGalleries(cat){
  const data = CATS[cat];
  const all = data.items.concat(data.editorial || []);
  gridPage.querySelectorAll('.card').forEach(card=>{
    const item = all[+card.dataset.i];
    if(!item || item.stack || !item.images || item.images.length < 2) return;
    const thumbLink = card.querySelector('.card-thumb-link');
    const thumb = card.querySelector('.card-thumb');
    const fillImg = thumb.querySelector('.fill-img');
    if(!thumbLink || !fillImg) return;
    const imgs = item.images.map(im => encodeImgPath(im.img));
    // true two-layer crossfade: a second image sits stacked exactly on
    // top of the first (.fill-img is already position:absolute/inset:0),
    // and switching images fades one out while fading the other in AT
    // THE SAME TIME, so there's always a fully- or partly-opaque image
    // covering the thumb — never a gap where the grey background under
    // it shows through, which is what caused the flash on cards like
    // Herzl when the mouse left mid-cycle.
    const fillImg2 = fillImg.cloneNode();
    fillImg2.style.opacity = '0';
    fillImg.after(fillImg2);
    let front = fillImg, back = fillImg2;
    let idx = 0, timer = null;
    // wait for the incoming image to actually be decoded before starting
    // the crossfade — setting src + opacity:1 in the same tick fades in
    // a still-blank <img> the instant it isn't already cached (every
    // gallery beyond the first couple of views, e.g. Herzl's 16 images
    // or Memento's 6), which is what showed as a white/grey flash
    const show = n => {
      idx = (n + imgs.length) % imgs.length;
      const target = imgs[idx];
      const reveal = () => {
        back.style.transition = 'opacity .35s ease';
        front.style.transition = 'opacity .35s ease';
        back.style.opacity = '1';
        front.style.opacity = '0';
        [front, back] = [back, front];
      };
      back.onload = null;
      back.src = target;
      if(back.complete) reveal();
      else back.onload = reveal;
    };
    const prevBtn = document.createElement('button');
    prevBtn.className = 'thumb-nav prev'; prevBtn.type = 'button';
    prevBtn.setAttribute('aria-label', 'Previous image'); prevBtn.textContent = '‹';
    const nextBtn = document.createElement('button');
    nextBtn.className = 'thumb-nav next'; nextBtn.type = 'button';
    nextBtn.setAttribute('aria-label', 'Next image'); nextBtn.textContent = '›';
    thumb.append(prevBtn, nextBtn);
    prevBtn.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); show(idx - 1); });
    nextBtn.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); show(idx + 1); });
    // leaving hover only stops the auto-advance — it does NOT jump back to
    // the cover. Whatever image was on screen when the mouse left stays as
    // the thumbnail, so the gallery reads as "settled here" rather than
    // snapping back every time. Also called from route() on every
    // navigation (see activeCardTimers below): a click that opens the
    // lightbox never fires mouseleave on the thumb it clicked, so without
    // this the interval would keep advancing images forever underneath
    // the (98%-opaque) lightbox scrim, reading as a flicker bleeding
    // through it.
    const stop = () => { clearInterval(timer); timer = null; };
    thumbLink.addEventListener('mouseenter', () => {
      if(timer) return;
      timer = setInterval(() => show(idx + 1), 1100);
      activeCardTimers.add(stop);
    });
    thumbLink.addEventListener('mouseleave', () => {
      activeCardTimers.delete(stop);
      stop();
    });
  });
}

/* ---------------------------------------------------------
   LIGHTBOX (general) — the generic project preview: image + text
   floating directly on the light scrim, no card (see .lb-panel
   comment). "close" sits at the top of the text column; click-outside
   or Escape also dismiss it.
--------------------------------------------------------- */
function openProjectLightbox(cat, item, startIdx){
  const images = item.images && item.images.length ? item.images : [{img:item.img, c:item.c, g:item.g}];
  let idx = (startIdx > 0 && startIdx < images.length) ? startIdx : 0;
  const frameHTML = im => im.img
    ? `<img src="${encodeImgPath(im.img)}" alt="${item.t}">`
    : `<div class="fill-block" style="${bg(im)}; aspect-ratio:1/1;">${glyphHTML(im)}</div>`;

  // shell is built once — only the media crossfades (see .lb-media-layer);
  // text doesn't change between images in the same gallery, so it isn't
  // touched, and nothing about the panel gets thrown away and rebuilt
  // just to change frames the way it used to
  lightbox.innerHTML = `
    <div class="lb-panel">
      <div class="lb-project-media${images.length > 1 ? ' has-multi' : ''}">
        <div class="lb-media-layer lb-media-a">${frameHTML(images[idx])}</div>
        <div class="lb-media-layer lb-media-b" style="opacity:0"></div>
        ${images.length > 1 ? `
          <button class="lb-panel-nav prev" aria-label="Previous image">‹</button>
          <button class="lb-panel-nav next" aria-label="Next image">›</button>
        ` : ''}
      </div>
      <div class="lb-project-text">
        <button class="lb-project-close" aria-label="Close">close</button>
        <div class="lb-project-body">
          <div class="lb-project-title">${item.t}</div>
          ${item.d ? `<p class="lb-project-desc">${item.d}</p>` : ''}
          ${item.note ? `<p class="lb-project-note">${item.note}</p>` : ''}
          ${item.caseStudy ? `<a class="lb-project-link" ${linkAttr('#/'+cat+'/'+item.slug)}>Read more about this project</a>` : ''}
        </div>
      </div>
    </div>
  `;
  let front = lightbox.querySelector('.lb-media-a');
  let back = lightbox.querySelector('.lb-media-b');
  // same load-gating as the grid thumb's crossfade (see wireCardGalleries):
  // reveal only once the incoming image has actually decoded, so a
  // not-yet-cached image never shows as a blank/grey frame mid-crossfade
  let goSeq = 0;
  const go = n => {
    idx = (n + images.length) % images.length;
    const seq = ++goSeq; // a slower, superseded image mustn't swap the layers when it finally loads
    const reveal = () => {
      if(seq !== goSeq) return;
      back.style.opacity = '1';
      front.style.opacity = '0';
      [front, back] = [back, front];
    };
    back.innerHTML = frameHTML(images[idx]);
    const incoming = back.querySelector('img');
    if(incoming && !incoming.complete) incoming.onload = reveal;
    else reveal();
  };
  lightbox.querySelector('.lb-project-close').addEventListener('click', e=>{ e.stopPropagation(); location.hash = '#/' + cat; });
  if(images.length > 1){
    lightbox.querySelector('.prev').addEventListener('click', e=>{ e.stopPropagation(); go(idx - 1); });
    lightbox.querySelector('.next').addEventListener('click', e=>{ e.stopPropagation(); go(idx + 1); });
    // clicking the image itself (not just the small arrows) advances too
    lightbox.querySelector('.lb-project-media').addEventListener('click', e=>{
      if(e.target.closest('.lb-panel-nav')) return;
      e.stopPropagation();
      go(idx + 1);
    });
  }

  lightbox.classList.add('show');
  document.body.style.overflow = 'hidden';
  lightbox.onclick = (e)=>{ if(e.target === lightbox) location.hash = '#/' + cat; };
  setLightboxKeys(e=>{ if(e.key === 'Escape') location.hash = '#/' + cat; });

  // FLIP: the clicked grid thumbnail's on-screen rect (captured by the
  // click handler before navigating) becomes the animation's start —
  // invert the delta between it and the image's real lightbox position
  // into a transform, then release it so it animates back to identity,
  // i.e. the image visibly flies from its grid spot into the lightbox
  // instead of the lightbox just appearing over it.
  const flight = pendingFlight;
  pendingFlight = null;
  const flyEl = flight && front.firstElementChild;
  if(flyEl){
    requestAnimationFrame(()=>{
      const finalRect = flyEl.getBoundingClientRect();
      if(!finalRect.width || !finalRect.height) return;
      const dx = flight.rect.left - finalRect.left;
      const dy = flight.rect.top - finalRect.top;
      const sx = flight.rect.width / finalRect.width;
      const sy = flight.rect.height / finalRect.height;
      flyEl.style.transformOrigin = 'top left';
      flyEl.style.transition = 'none';
      flyEl.style.transform = `translate(${dx}px,${dy}px) scale(${sx},${sy})`;
      flyEl.getBoundingClientRect(); // force reflow before re-enabling the transition
      requestAnimationFrame(()=>{
        flyEl.style.transition = 'transform .6s cubic-bezier(.22,1,.36,1)';
        flyEl.style.transform = 'none';
        flyEl.addEventListener('transitionend', ()=>{ flyEl.style.transition = ''; flyEl.style.transformOrigin = ''; }, {once:true});
      });
    });
  }
}

/* ---------------------------------------------------------
   CASE STUDY PAGE — for the handful of projects that
   genuinely need a long-form page instead of a popup.
--------------------------------------------------------- */
function renderCasePage(cat, item){
  const cs = item.caseStudy;

  /* series-based case study (City Symbol shape):
     title block, then one section per city: statement + symbol grid */
  if(cs && cs.series){
    casePage.innerHTML = `
      <div class="case-top">
        <div class="back" data-back="${cat}">← Back to ${CATS[cat].label}</div>
        <h1 class="case-h1">${item.t}</h1>
        <div class="case-intro-cols">
          <p>${cs.intro}</p>
          ${cs.note ? `<p class="case-note">${cs.note}</p>` : ''}
        </div>
      </div>
      ${cs.series.map(s=>`
        <section class="series" data-series="${s.key}">
          <p class="series-statement">${s.statement}</p>
          <div class="series-grid">
            ${s.symbols.map((sym,i)=>`
              <a class="sym" ${linkAttr('#/'+cat+'/'+item.slug+'/'+slugify(sym.n))} style="transition-delay:${i*28}ms">
                <div class="sym-img" style="background-image:url('${symUrl(cat, item.slug, sym.f)}')"></div>
                <div class="sym-name">${sym.n}</div>
              </a>
            `).join('')}
          </div>
        </section>
      `).join('')}
    `;
  } else if(cs){
    /* long-form editorial shape (Eko, Island.io, Sex, Anthropomass) */
    casePage.innerHTML = `
      <div class="case-hero" style="${cs.bgImg ? `background-image:url('${cs.bgImg}'); background-size:cover; background-position:center;` : `background:${cs.bg};`}">
        <div class="back" data-back="${cat}">← Back</div>
        <div class="case-hero-glyph">${item.g||''}</div>
        <h1>${item.t}</h1>
        <p>${cs.intro}</p>
      </div>
      <div class="case-body">${(cs.paragraphs||[]).map(p=>`<p>${p}</p>`).join('')}</div>
      <div class="case-media">
        ${(cs.media||[]).map(m=>`<div class="m ${m.full?'full':''}" style="${bg(m)}">${glyphHTML(m)}</div>`).join('')}
      </div>
      ${item.images && item.images.length ? `
      <div class="case-gallery">
        ${item.images.map(im=>`<img src="${encodeImgPath(im.img)}" alt="${item.t}">`).join('')}
      </div>` : ''}
      ${cs.testimonial ? `
      <div class="case-testimonial">
        <div class="avatar">${cs.testimonial.avatar||'👤'}</div>
        <div>
          <p>"${cs.testimonial.quote}"</p>
          <div class="who">${cs.testimonial.who}</div>
        </div>
      </div>` : ''}
    `;
  } else {
    /* generic fallback: any project without a hand-written case study
       still gets a real full page — title, description, and every
       image in its folder as a gallery */
    const gallery = (item.images && item.images.length) ? item.images : (item.img ? [{img:item.img}] : []);
    casePage.innerHTML = `
      <div class="case-top">
        <div class="back" data-back="${cat}">← Back to ${CATS[cat].label}</div>
        <h1 class="case-h1">${item.t}</h1>
        ${item.d ? `<div class="case-intro-cols"><p>${item.d}</p></div>` : ''}
      </div>
      <div class="case-gallery">
        ${gallery.map(im=>`<img src="${encodeImgPath(im.img)}" alt="${item.t}">`).join('')}
      </div>
    `;
  }

  casePage.querySelector('[data-back]').addEventListener('click', ()=>{
    location.hash = '#/' + cat;
  });

  // reveal symbols on scroll
  if(typeof IntersectionObserver !== 'undefined'){
    const io = new IntersectionObserver(entries=>{
      entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
    }, {threshold:.12, rootMargin:'0px 0px -40px 0px'});
    casePage.querySelectorAll('.sym, .series-statement').forEach(el=> io.observe(el));
  } else {
    casePage.querySelectorAll('.sym, .series-statement').forEach(el=> el.classList.add('in'));
  }
}

/* ---------------------------------------------------------
   LIGHTBOX — one symbol, deep-linked.
   #/illustration/city-symbol/ymca
   Arrow keys move between symbols and the URL follows, so any
   symbol you are looking at is always the URL you can share.
--------------------------------------------------------- */
const lightbox = document.getElementById('lightbox');

function flatSymbols(item){
  const out = [];
  (item.caseStudy.series||[]).forEach(s=> s.symbols.forEach(sym=> out.push({...sym, series:s})));
  return out;
}

function openLightbox(cat, item, sym){
  const all = flatSymbols(item);
  const idx = all.findIndex(s=> slugify(s.n) === slugify(sym.n));
  const prev = all[(idx-1+all.length)%all.length];
  const next = all[(idx+1)%all.length];

  lightbox.innerHTML = `
    <button class="lb-close" aria-label="Close">close</button>
    <button class="lb-nav prev" aria-label="Previous">‹</button>
    <button class="lb-nav next" aria-label="Next">›</button>
    <figure class="lb-figure">
      <img src="${symUrl(cat, item.slug, sym.f)}" alt="${sym.n}">
      <figcaption>
        <strong>${sym.n}</strong>
        <span style="color:${sym.series.accent}">${sym.series.name}</span>
      </figcaption>
    </figure>
  `;
  lightbox.classList.add('show');
  document.body.style.overflow = 'hidden';

  const base = '#/' + cat + '/' + item.slug;
  lightbox.querySelector('.lb-close').onclick = ()=> location.hash = base;
  lightbox.querySelector('.prev').onclick = ()=> location.hash = base + '/' + slugify(prev.n);
  lightbox.querySelector('.next').onclick = ()=> location.hash = base + '/' + slugify(next.n);
  lightbox.onclick = (e)=>{ if(e.target === lightbox) location.hash = base; };

  setLightboxKeys(e=>{
    if(e.key === 'Escape') location.hash = base;
    if(e.key === 'ArrowLeft') location.hash = base + '/' + slugify(prev.n);
    if(e.key === 'ArrowRight') location.hash = base + '/' + slugify(next.n);
  });
}

// one keydown handler at a time: stepping from symbol to symbol reopens
// the lightbox without closing it, and each open used to add another
// listener on top of the last, so every key press ran all of them
function setLightboxKeys(fn){
  if(lightbox._keys) document.removeEventListener('keydown', lightbox._keys);
  lightbox._keys = fn;
  if(fn) document.addEventListener('keydown', fn);
}

function closeLightbox(){
  lightbox.classList.remove('show');
  setLightboxKeys(null);
  document.body.style.overflow = '';
}

/* ---------------------------------------------------------
   SMOOTH (INERTIA) SCROLL
   This is the part CSS alone can't do: the page keeps drifting
   a little after you stop scrolling, instead of stopping dead.
   Lenis intercepts the wheel/touch input and eases the scroll
   position toward it every frame. Everything above still works
   completely normally without this, it's a feel layer only.
--------------------------------------------------------- */
</script>
<script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.42/bundled/lenis.min.js"></script>
<script>
  if (window.Lenis) {
    const lenis = new Lenis({
      duration: 1.05,             // higher = more drift/weight, lower = snappier
      easing: t => 1 - Math.pow(1 - t, 3),
      smoothWheel: true,
    });
    function raf(time){ lenis.raf(time); requestAnimationFrame(raf); }
    requestAnimationFrame(raf);

    // pause inertia while the lightbox is open so background scroll doesn't fight it
    const scrimObserver = new MutationObserver(()=>{
      if(document.getElementById('lightbox').classList.contains('show')) lenis.stop();
      else lenis.start();
    });
    scrimObserver.observe(document.getElementById('lightbox'), {attributes:true, attributeFilter:['class']});
  }
</script>
</body>
